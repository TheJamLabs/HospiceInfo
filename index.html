<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      var m = 'auto';
      try { var s = localStorage.getItem('hfuk-theme'); if (s === 'light' || s === 'dark') { m = s; } } catch (e) {}
      var d = m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-bs-theme', d ? 'dark' : 'light');
    })();
  </script>
    <meta
      name="description"
      content="Interactive map of hospice service areas across the UK, derived from GP practice locations, with charity-shop markers and corrections log."
    />
    <title>Hospice Finder UK</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
